<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <title>Planner Aesthetic Pro</title>
    <style>
        :root { --pink: #FFD1DC; --cream: #FFF5E1; --brown: #5D4037; --bg: var(--cream); --text: var(--brown); --box: #ffffff; }
        .dark-mode { --pink: #ff85a1; --cream: #2d2325; --brown: #fce4ec; --bg: #1a1516; --text: #fce4ec; --box: #3d3436; }
        
        body { background: var(--bg); color: var(--text); font-family: 'Segoe UI', sans-serif; padding: 20px; transition: 0.3s; margin: 0; }
        .app-container { display: grid; grid-template-columns: 1fr 300px; gap: 20px; max-width: 1200px; margin: auto; }
        .box { background: var(--box); padding: 20px; border-radius: 20px; border: 2px solid var(--pink); box-shadow: 0 4px 10px rgba(0,0,0,0.1); }
        
        /* Calendario */
        .calendar-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; }
        .calendar-grid { display: grid; grid-template-columns: repeat(7, 1fr); gap: 8px; }
        .day { border: 1px solid var(--pink); padding: 10px; min-height: 100px; border-radius: 12px; font-size: 0.8em; }
        .day-name { font-weight: bold; text-align: center; color: var(--pink); }
        
        /* Tareas y UI */
        .task-dot { background: var(--pink); color: #000; padding: 4px; border-radius: 6px; margin-top: 4px; display: flex; justify-content: space-between; align-items: center; font-size: 0.85em; }
        .delete-btn { cursor: pointer; font-weight: bold; padding: 0 5px; }
        textarea { width: 100%; height: 150px; background: transparent; border: 1px solid var(--pink); border-radius: 10px; color: var(--text); padding: 10px; resize: none; margin-top: 10px; }
        input, button { width: 100%; padding: 10px; margin: 5px 0; border: 1px solid var(--pink); border-radius: 10px; background: var(--box); color: var(--text); }
        button { background: var(--pink); color: #000; font-weight: bold; cursor: pointer; }
    </style>
</head>
<body>

<div class="app-container">
    <div class="box">
        <div class="calendar-header">
            <button onclick="cambiarMes(-1)" style="width: 50px;">◀</button>
            <h2 id="mes-titulo">JUNIO 2026</h2>
            <button onclick="cambiarMes(1)" style="width: 50px;">▶</button>
            <button onclick="document.body.classList.toggle('dark-mode')" style="width: 50px;">🌙</button>
        </div>
        <div class="calendar-grid" id="calendario"></div>
    </div>

    <div class="box">
        <h3>Nuevo Evento</h3>
        <input type="text" id="nombre" placeholder="Nombre de la tarea...">
        <input type="date" id="fecha">
        <button onclick="addTarea()">Agregar al calendario</button>
        
        <h3>Notas Personales</h3>
        <textarea id="notas" oninput="saveNotas()" placeholder="Escribe tus apuntes aquí..."></textarea>
    </div>
</div>

<script>
    let currentDate = new Date();
    let tareas = JSON.parse(localStorage.getItem("tareas") || "[]");
    document.getElementById("notas").value = localStorage.getItem("misNotas") || "";

    function saveNotas() { localStorage.setItem("misNotas", document.getElementById("notas").value); }

    function cambiarMes(dir) {
        currentDate.setMonth(currentDate.getMonth() + dir);
        renderizar();
    }

    function renderizar() {
        document.getElementById("mes-titulo").innerText = currentDate.toLocaleString('es-ES', { month: 'long', year: 'numeric' }).toUpperCase();
        const cal = document.getElementById("calendario");
        cal.innerHTML = `
            <div class="day-name">Lun</div><div class="day-name">Mar</div><div class="day-name">Mié</div>
            <div class="day-name">Jue</div><div class="day-name">Vie</div><div class="day-name">Sáb</div><div class="day-name">Dom</div>
        `;
        
        const primerDia = new Date(currentDate.getFullYear(), currentDate.getMonth(), 1).getDay() || 7;
        const diasEnMes = new Date(currentDate.getFullYear(), currentDate.getMonth() + 1, 0).getDate();

        for (let i = 1; i < primerDia; i++) cal.innerHTML += `<div></div>`;
        for (let i = 1; i <= diasEnMes; i++) {
            let fechaStr = `${currentDate.getFullYear()}-${(currentDate.getMonth()+1).toString().padStart(2, '0')}-${i.toString().padStart(2, '0')}`;
            let tareasDia = tareas.filter(t => t.fecha === fechaStr);
            
            cal.innerHTML += `
                <div class="day"><b>${i}</b>
                    ${tareasDia.map(t => `
                        <div class="task-dot">
                            ${t.nombre} 
                            <span class="delete-btn" onclick="borrar('${t.id}')">x</span>
                        </div>`).join('')}
                </div>`;
        }
    }

    function addTarea() {
        let nombre = document.getElementById("nombre").value;
        let fecha = document.getElementById("fecha").value;
        if(!nombre || !fecha) return;
        tareas.push({ id: Date.now().toString(), nombre, fecha });
        localStorage.setItem("tareas", JSON.stringify(tareas));
        document.getElementById("nombre").value = "";
        renderizar();
    }

    function borrar(id) {
        tareas = tareas.filter(t => t.id !== id);
        localStorage.setItem("tareas", JSON.stringify(tareas));
        renderizar();
    }

    renderizar();
</script>
</body>
</html>
